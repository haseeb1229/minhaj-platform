# =============================================================================
# BROWSER SUITE ONLY — the one harness setting the production template lacks
# =============================================================================
#
# Each spec presents ITS OWN client address (`tests/browser/support.ts`), so
# the real per-client rate limits do not couple unrelated specs together. In
# front of NGINX that address arrives in `X-Forwarded-For`, exactly as it would
# from a trusted load balancer ahead of the proxy.
#
# This file tells NGINX's real-IP module to treat the sender of that header as
# such a balancer. NGINX then takes the spec's address as the client address
# and, as the template always does, SETS `X-Forwarded-For` to it — the
# template's rule (forwarding headers are set, never passed through) is
# unchanged, and the web process still reads only what NGINX wrote.
#
# Trusting every source is safe HERE ONLY: the harness publishes this proxy on
# the host's loopback interface, so the only possible sender is the test run
# itself. It is mounted by `scripts/browser-server.mjs` and nowhere else; no
# deployment, Compose service or CI image ever reads it.
# =============================================================================

set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
