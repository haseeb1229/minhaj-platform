# =============================================================================
# Local development stack — Phase 1 Chunk 1
# =============================================================================
#
# SQL Server is the only Phase 1 service added to the Phase 0B stack:
#
#   - SQL Server 2022 Developer is the local database target.
#   - Phase 25 adds `realtime` (the Socket.IO process) and `proxy`, the NGINX
#     WebSocket SEAM in front of web and realtime. Both sit behind the
#     `realtime` profile, so `docker compose up sqlserver` or `clamav` starts
#     exactly what it always did. TLS, DNS and the full deployment shape
#     remain the deployment phase's.
#   - Redis is explicitly not adopted (TECH_STACK.md 15).
#
# Services are added by the phase that genuinely needs them.
# No secrets are defined here.
# =============================================================================

name: minhaj-platform

services:
  sqlserver:
    # SQL Server 2022 Developer WITH Full-Text Search (Phase 17). The official
    # images ship without the FTS component, and SQL Server FTS is the locked V1
    # search engine (TECH_STACK.md §10). `sqlserver/Dockerfile` adds exactly
    # `mssql-server-fts`, pinned to the same engine build as its pinned base, and
    # its build context is that directory alone — nothing else in the repository,
    # including the ignored `.env` beside this file, can enter the image.
    #
    # `pull_policy: build` because this image exists nowhere to pull: it is
    # always produced from the reviewed Dockerfile, locally and in CI alike.
    build:
      context: ./sqlserver
    image: minhaj-platform-sqlserver-fts:16.0.4265.3
    pull_policy: build
    container_name: minhaj-sqlserver-2022
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in ignored docker/.env}
    ports:
      # Host 1433 is occupied by the pre-existing SQL Server installation.
      # Keep the normal container port and bind the Minhaj instance only to
      # loopback on a non-conflicting development port.
      - '127.0.0.1:${MINHAJ_SQLSERVER_PORT:-14330}:1433'
    volumes:
      - minhaj-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # The malware scanner (SECURITY_BASELINE.md 10.1 rule 4). Selected in this
  # phase, as the baseline defers it to "the phase that implements the storage
  # foundation".
  #
  # A SIDECAR, not part of the web image. The runtime image stays lean and the
  # scanner's signature database is not rebuilt every time the application is.
  #
  # NO STORAGE MOUNT. The application sends bytes over the socket with clamd's
  # INSTREAM command, so the scanner never needs access to the storage root. A
  # compromised scanner cannot reach the corpus because it was never shown it.
  clamav:
    image: clamav/clamav:1.5.2
    container_name: minhaj-clamav
    environment:
      # Signature updates are a deliberate operational action, not something
      # that happens while a developer is trying to start the stack. The image
      # ships with a database; refreshing it is enabled per environment.
      CLAMAV_NO_FRESHCLAMD: 'true'
    ports:
      - '127.0.0.1:${MINHAJ_CLAMAV_PORT:-3310}:3310'
    healthcheck:
      # clamd answers PING with PONG only once its database is loaded, which
      # takes appreciably longer than the process takes to start. Waiting for
      # the real answer is what stops an upload meeting a scanner that is up
      # but not yet able to scan.
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      # The development RUNTIME stage. The `test` stage is a separate target,
      # built and run by the verification pipeline, and is never what serves.
      target: dev
    container_name: minhaj-web
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: '3000'
      LOG_LEVEL: debug
      # The schema's own default, unless the proxy profile names its origin.
      AUTH_BASE_URL: ${MINHAJ_PUBLIC_ORIGIN:-http://localhost:3000}
      # Required for file watching to work across a bind mount.
      WATCHPACK_POLLING: 'true'
      # Inside the container the storage root is a named volume, deliberately
      # outside /app so it is not shadowed by the live source bind mount.
      STORAGE_ROOT: /var/lib/minhaj/storage
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      # Source is live-mounted; container-managed directories are masked with
      # anonymous volumes so host artefacts and platform-specific binaries do
      # not collide with the container's own.
      - ..:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - minhaj-storage-data:/var/lib/minhaj/storage
    working_dir: /app
    init: true

  # Phase 25 — the realtime process: Socket.IO over the SAME Messaging and
  # Identity services the web process uses, composed by its own Layer-4 root
  # (`apps/web/src/composition/realtime-main.ts`). It owns no data and no rule.
  #
  # Behind the `realtime` profile with `proxy`: `docker compose --profile
  # realtime up` starts both. Not published on the host — the browser reaches it
  # only through the proxy, at the same origin as the web pages, which is what
  # its exact-Origin handshake check assumes.
  #
  # ONE PUBLIC ORIGIN FOR BOTH PROCESSES. A session cookie is verified against
  # `AUTH_BASE_URL`, and the handshake admits only that origin, so web and
  # realtime read the same `MINHAJ_PUBLIC_ORIGIN`. Its default is the web
  # process's own default, so the stack without the profile behaves exactly as
  # before; browse through the proxy with
  # `MINHAJ_PUBLIC_ORIGIN=http://localhost:8080`.
  realtime:
    profiles: [realtime]
    build:
      context: ..
      dockerfile: docker/realtime.Dockerfile
    image: minhaj-platform-realtime:local
    pull_policy: build
    container_name: minhaj-realtime
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      AUTH_BASE_URL: ${MINHAJ_PUBLIC_ORIGIN:-http://localhost:3000}
      # The RUNTIME principal's URL as this container sees SQL Server (host
      # `sqlserver`, port 1433) — never the migration principal's. Unset, the
      # process refuses to start and names the variable.
      DATABASE_URL: ${MINHAJ_CONTAINER_DATABASE_URL:-}
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: '3200'
    expose:
      - '3200'
    init: true

  # Phase 25 — the NGINX WebSocket SEAM: ordinary HTTP to `web`, `/socket.io/`
  # upgraded to `realtime`, forwarding headers set by NGINX and never passed
  # through (`nginx/templates/default.conf.template`). TLS termination, DNS and
  # the rest of the deployment front door are the deployment phase's.
  #
  # Pinned by digest: a proxy is the trust boundary every request crosses.
  proxy:
    profiles: [realtime]
    image: nginx:1.30.6-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    container_name: minhaj-proxy
    environment:
      NGINX_ENVSUBST_FILTER: '^MINHAJ_'
      MINHAJ_PUBLIC_HOST: localhost
      MINHAJ_WEB_UPSTREAM: web:3000
      MINHAJ_REALTIME_UPSTREAM: realtime:3200
    ports:
      - '127.0.0.1:${MINHAJ_PROXY_PORT:-8080}:8080'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - web
      - realtime

volumes:
  minhaj-sqlserver-data:
    name: minhaj-platform-sqlserver-data

  # PERSISTENT from the moment it first exists. It holds the authoritative
  # bytes of every stored asset, which no backup of SQL Server contains, and it
  # is never a cleanup target. Tests use disposable temporary roots instead.
  minhaj-storage-data:
    name: minhaj-platform-storage-data
