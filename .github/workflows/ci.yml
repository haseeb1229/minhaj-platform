name: CI

# Version check → format → typecheck → lint → architecture validation →
# RTL validation → tests → server-only build proof → production build
# (ARCHITECTURE.md §10.3, DELIVERY_PLAN.md Phase 0B).
#
# No deployment, no cloud credentials, no environments, no release workflow.
# Only the official checkout and setup-node actions are used.
#
# Every job below runs for each trigger. There is no path filter anywhere in
# this file, deliberately: a filter that skipped CI for "documentation-only"
# changes is one rename away from letting a source change through unvalidated,
# and the whole suite is minutes rather than hours.

# WHICH REFS ARE VALIDATED
#
# `main` and pull requests into it were the whole policy, and the consequence
# was that governed work received no remote validation at all: pushing
# `feature/pre-phase-2-baseline-hardening` triggered nothing, so the only ways
# to obtain CI were to open a pull request for work that was not ready for one,
# or to merge to `main` to find out whether merging to `main` was safe.
#
# Governed feature, phase and maintenance branches are therefore validated on
# push. The namespaces are narrow ON PURPOSE: `feature/**` covers planned work
# and `fix/**` covers maintenance checkpoints. A catch-all `'**'` would spend
# runner time on scratch branches while proving nothing extra about governed work.
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]

# Read-only, unchanged. The workflow never writes to the repository, reads no
# repository secret, and uses no `pull_request_target` (SECURITY_BASELINE.md
# §18.1). Validating more branches must not widen what CI is trusted to do.
permissions:
  contents: read

# One run per EVENT AND REF.
#
# A branch with an open pull request now matches both triggers, and the two
# arrive under different refs — `refs/heads/<branch>` and `refs/pull/N/merge` —
# and validate different contexts. The push checks the branch-head commit; the
# pull request checks GitHub's synthetic merge ref against current `main`.
# Cancelling either one with the other can discard the only merge-ref proof or
# the only branch-push proof, so cross-event cancellation is not safe.
#
# `github.event_name` keeps push and pull-request validation independent.
# `github.ref` keeps branch pushes separate and gives every pull request its own
# `refs/pull/<number>/merge` group, including forks whose source branches happen
# to share a name. A newer run for the same event/ref still cancels stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The locked runtime (TECH_STACK.md §3). A mismatch is a hard failure, in CI
  # and on a workstation alike.
  NODE_VERSION: '24.20.0'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Reproducible install from the committed lockfile. `npm ci` fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Verify locked stack versions
        run: npm run check:versions

      # No secret artifact may reach a Docker build context, at any depth, and
      # no later `.dockerignore` negation may re-open one (SECURITY_BASELINE.md
      # §18.1). Deliberately in THIS job rather than beside the image build: it
      # reasons about the committed policy and needs no daemon, so it runs on
      # every push and every pull request, which is where an unsafe edit is
      # actually made.
      - name: Verify the Docker build-context secret policy
        run: npm run check:docker-context

      # The Prisma client is GENERATED output. It is not committed (it lives
      # under `node_modules/.prisma`, which `.gitignore` excludes), so on a
      # fresh `npm ci` `@prisma/client` re-exports a module that does not exist
      # yet and `packages/database/src/client.ts` fails to compile with
      # TS2305 — `has no exported member 'PrismaClient'`.
      #
      # A workstation never sees this: it generated the client at some earlier
      # point and the output survives in `node_modules`. Only a clean runner
      # exposes it, which is exactly what this job is for.
      #
      # This is `prisma generate`, which reads the schema and emits types. It
      # opens NO database connection — verified by generating successfully
      # against a port with nothing listening — so it belongs here in the
      # offline verification job rather than beside the live database gates.
      # The Docker test stage already does the same thing before its suite.
      #
      # The URL below exists solely because `prisma.config.ts` resolves
      # `env('DATABASE_MIGRATION_URL')` when the CONFIG LOADS, before Prisma
      # knows which command was asked for. Without it, generation fails with
      # `PrismaConfigEnvError: Cannot resolve environment variable` — on a
      # clean runner, which has no `docker/.env`. A workstation hides this,
      # because the repository loader reads the variable out of that file.
      # `db:generate` is offline tooling, so the file is OPTIONAL to it and a
      # caller without one must supply the variable itself, exactly as here.
      #
      # It is deliberately, visibly synthetic: a database and login that exist
      # nowhere, and a password that is not a credential because nothing
      # authenticates with it. It is scoped to THIS STEP so no later step can
      # inherit it — the live database gates must resolve their own real
      # configuration and fail closed if they cannot. Making the migration URL
      # optional in `prisma.config.ts` would have been the wrong fix: it would
      # weaken the fail-closed contract for every command, to satisfy the one
      # command that does not need a database at all.
      - name: Generate the Prisma client
        env:
          DATABASE_MIGRATION_URL: sqlserver://127.0.0.1:14330;database=PrismaGenerateOnly;user=generate_only;password=GenerateOnly1!aZ;encrypt=true;trustServerCertificate=true
        run: npm run db:generate

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      # Lint carries the RTL rules, the safety rules, and `noInlineConfig` over
      # production source so an architecture rule cannot be disabled inline.
      - name: Lint
        run: npm run lint

      # THE authoritative architecture gate. A separate process that resolves
      # every import to a real path, so no import syntax and no ESLint
      # directive can evade it (ARCHITECTURE.md §6.3 rule 12).
      - name: Architecture validation
        run: npm run check:architecture

      # Logical-direction layout across source and stylesheets.
      - name: RTL validation
        run: npm run check:rtl

      # Adversarial regression suite: every bypass previously demonstrated
      # against these rules must still be rejected. This includes the
      # production-start fail-fast integration test, which drives the real
      # start command and asserts no listener survives an invalid environment.
      #
      # Review #4 additions covered here:
      #   - TypeScript PROJECT membership, so an unreferenced nested tsconfig
      #     cannot redefine how the analyser resolves an import (B1)
      #   - repository-local declarations named `next-env.d.ts` staying in the
      #     graph (B2)
      #   - Layer 4 composition rules, distinct from Layer 0 (B3)
      #   - the SIGTERM lifecycle of the start wrapper (B4)
      #
      # Review #5 additions covered here:
      #   - the real `ts.Program` closure as the ownership and graph authority,
      #     so a file `exclude`d from root discovery but loaded by an import
      #     keeps the project's own `paths` (B1). These tests shell out to the
      #     REAL `tsc --noEmit -p` and assert it PASSES before asserting the
      #     architecture fails — the missing half of the Round 4 proof.
      #   - repository-local declarations at a WORKSPACE ROOT entering the
      #     graph whatever they are named, with the narrow generated-Next
      #     exception still holding (B2)
      #   - explicit workspace roles, with no directory-tier default: an
      #     unregistered `apps/foo` no longer receives Layer 4 (B3)
      #   - deterministic project ownership, failing closed on genuine
      #     ambiguity, and resolved local targets that can never vanish
      #
      # This runner is Linux, which matters for B4: signals are a POSIX
      # mechanism, and on Windows the orphan assertion passes even against the
      # broken wrapper because the OS tears down the whole process tree. The
      # Linux run is what makes that test evidence rather than decoration.
      - name: Tests
        run: npm run test

      # Real `next build` proof that a Client Component cannot reach
      # `@minhaj/server-core` or the server environment implementation by ANY
      # route — package name, package subpath, relative source path, alias, or
      # a wrapper chain — and that a Server Component still can. Each variant
      # must fail specifically for the boundary reason, so a broken fixture
      # cannot masquerade as enforcement.
      - name: Server-only boundary build proof
        run: npm run check:server-only

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # The container image, built and verified as its own job.
  #
  # Review #3 (N5) found the image copying `tests/` into the RUNNING image while
  # omitting `.env.example`, an input three of those tests read. The Dockerfile
  # now separates a `test` stage (complete inputs, never shipped) from a `dev`
  # runtime stage (application source only), and CI proves BOTH: the suite
  # passes inside the image, and the runtime image still builds.
  #
  # No registry, no credentials, no deployment. The image is built and
  # discarded.
  # ---------------------------------------------------------------------------
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # Proves the test stage has every input its suite needs — the exact
      # defect Review #3 reported.
      - name: Build and run the test stage
        run: |
          docker build --target test -t minhaj-web-test -f docker/web.Dockerfile .
          docker run --rm minhaj-web-test

      # Proves the lean runtime stage still builds after the split.
      - name: Build the runtime stage
        run: docker build --target dev -t minhaj-web-dev -f docker/web.Dockerfile .

      # A compose file that does not parse is a broken developer setup.
      #
      # `MSSQL_SA_PASSWORD` is declared `${...:?}` so the stack fails closed
      # rather than starting SQL Server with an empty `sa` password. That guard
      # is correct and stays: this job has no `docker/.env`, so interpolation
      # has nothing to resolve and `config` rightly refuses.
      #
      # The value below exists ONLY so interpolation can complete and the file
      # can be parsed. It is not a secret, it starts no container, and nothing
      # connects with it — this step renders the configuration and exits. A
      # real password here would be a committed credential; removing the guard
      # to avoid needing one would trade a parse check for a security control.
      - name: Validate the compose stack
        env:
          MSSQL_SA_PASSWORD: ComposeConfigOnly1!aZ
        run: docker compose -f docker/compose.yaml config

  # ---------------------------------------------------------------------------
  # The Phase 1 database foundation, proven against a REAL SQL Server 2022
  # Developer instance (DELIVERY_PLAN.md Phase 1).
  #
  # The gate protects the whole Phase 1 lifecycle, in the order a defect would
  # surface: connectivity, the real Prisma migration lifecycle including
  # rollback and re-apply, the least-privilege permission boundary, and finally
  # the genuine backup/restore recovery proof — "a backup that has never been
  # restored is not a backup" (ARCHITECTURE.md §10.4).
  #
  # The recovery proof runs FOR REAL here. Backup and restore are executed by
  # the SQL Server service container against its own storage, which needs
  # nothing of the runner beyond the service itself, so there is no reason to
  # settle for a weaker CI-safe equivalent.
  #
  # Credentials are EPHEMERAL and generated per run. Nothing here reads a
  # repository secret: a local Developer-edition database that exists only for
  # the life of one job does not need a long-lived stored credential, and
  # adding one would create a standing secret with no standing purpose
  # (SECURITY_BASELINE.md §18.1).
  # ---------------------------------------------------------------------------
  database:
    name: Database foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generated per run and written only to `docker/.env`, which is
      # git-ignored. `>> $GITHUB_ENV` is deliberately NOT used: values placed
      # there are visible to every later step, and these never need to be.
      #
      # `openssl rand -hex 24` supplies 192 bits of entropy over `[0-9a-f]`
      # only, and the fixed prefix and suffix guarantee the SQL Server password
      # policy is met (upper, lower, digit, symbol).
      #
      # The alphabet is the load-bearing part. These passwords are written into
      # `docker/.env` and embedded in the connection URLs there, and that file
      # is read by TWO parsers: the repository's own loader, which splits each
      # line at the first `=`, and Node's `--env-file`, which follows dotenv
      # rules. An earlier revision used `-base64` with a `#` in the suffix, and
      # dotenv treats an unquoted `#` as the start of a comment — so Node
      # truncated `DATABASE_MIGRATION_URL` at the password and silently dropped
      # the `encrypt=true;trustServerCertificate=true` that follows it. Prisma
      # then met the container's self-signed certificate without the
      # accommodation and failed with P1011, while every command going through
      # the repository loader passed in the same run.
      #
      # Hex plus `!` contains no `#`, `;`, `=`, `{`, `}`, `/`, backslash or
      # newline, so both parsers resolve the identical, complete URL.
      # `tests/config/ci-credentials.test.ts` asserts this against the recipe
      # read out of this file, so a future edit cannot quietly reintroduce a
      # character that breaks one parser and not the other.
      - name: Generate ephemeral database credentials
        run: |
          SA_PASSWORD="Ci$(openssl rand -hex 24)!1aZ"
          APP_PASSWORD="Ci$(openssl rand -hex 24)!2aZ"
          # Phase 2 Chunk 2: the dedicated privileged-operations principal. A
          # THIRD account, because the migration principal must not perform
          # routine bootstrap or recovery and the runtime principal must never
          # be able to (SECURITY_BASELINE.md 8.3, 18.2).
          OPERATOR_PASSWORD="Ci$(openssl rand -hex 24)!3aZ"

          # Masked so that if any command ever echoes one, the log shows ***.
          echo "::add-mask::$SA_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$OPERATOR_PASSWORD"

          mkdir -p docker
          {
            echo "MSSQL_SA_PASSWORD=${SA_PASSWORD}"
            echo "MINHAJ_SQLSERVER_PORT=14330"
            echo "DATABASE_URL=sqlserver://localhost:14330;database=MinhajPlatform;user=minhaj_app;password=${APP_PASSWORD};encrypt=true;trustServerCertificate=true"
            echo "DATABASE_MIGRATION_URL=sqlserver://localhost:14330;database=MinhajPlatform;user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
            echo "DATABASE_APP_LOGIN=minhaj_app"
            echo "DATABASE_APP_PASSWORD=${APP_PASSWORD}"
            echo "DATABASE_OPERATOR_LOGIN=minhaj_operator_ci"
            echo "DATABASE_OPERATOR_PASSWORD=${OPERATOR_PASSWORD}"
          } > docker/.env

          chmod 600 docker/.env

      # The same image and the same loopback-only port binding the local stack
      # uses, started from the repository's own compose file so CI cannot drift
      # from what a developer runs. Only the database service is started; the
      # web service is not part of this gate.
      #
      # Since Phase 17 this BUILDS the repository's SQL Server image first
      # (`docker/sqlserver/Dockerfile`): the official image with Full-Text Search
      # added, pinned to one engine build, so CI proves search on the same engine
      # a developer runs.
      - name: Start SQL Server 2022 Developer
        run: docker compose -f docker/compose.yaml up -d --wait sqlserver

      # `--wait` returns on the compose healthcheck, which is the same
      # `SELECT 1` probe the local stack uses, so the server is accepting
      # connections by this point.
      #
      # `db:test:connection` is deliberately NOT run here: it connects over
      # `DATABASE_URL`, as the least-privilege runtime principal, to
      # `MinhajPlatform` — neither of which exists yet. It runs once both do,
      # below, where a failure means something real rather than an ordering
      # artefact.
      - name: Create the Phase 1 database
        run: |
          docker exec minhaj-sqlserver-2022 /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$(grep '^MSSQL_SA_PASSWORD=' docker/.env | cut -d= -f2-)" \
            -C -b -Q "IF DB_ID(N'MinhajPlatform') IS NULL CREATE DATABASE [MinhajPlatform];"

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Validate the Prisma schema
        run: npm run db:validate

      # The REAL Prisma migration lifecycle on a disposable database: deploy,
      # status, schema verification, seed twice, reviewed rollback, re-deploy.
      - name: Migration lifecycle
        run: npm run db:migrate:test

      # The least-privilege boundary, proven with the actual application
      # principal and asserted on SQL Server error numbers.
      - name: Least-privilege permission proof
        run: npm run db:test:permissions

      # Phase 2 Chunk 2. The HOST-ONLY privileged boundary, with the actual
      # principals: the operator may execute exactly two audited procedures and
      # nothing else, the application principal may execute neither, and the
      # bootstrap is one-time, race-safe and audited
      # (SECURITY_BASELINE.md 8.2, 8.3).
      - name: Privileged operator proof
        run: npm run db:test:operator

      # Bring the persistent CI database to the migrated, provisioned state the
      # recovery rehearsal reads from — the state a developer's MinhajPlatform
      # is already in locally.
      #
      # Runs the REAL `prisma migrate deploy` through the same deterministic
      # loader every other database command uses. An earlier revision invoked
      # the CLI directly under `node --env-file=docker/.env`, which put a
      # second parser on that file — and dotenv's `#` comment rule truncated
      # the connection URL past the password, dropping its TLS settings and
      # failing with P1011 while every loader-based command passed.
      #
      # Applying migrations to a persistent database stays deliberate and
      # explicit (ARCHITECTURE.md §10.3); this is a named command run on
      # purpose, never a side effect of another step.
      - name: Apply migrations to the Phase 1 database
        run: npm run db:migrate:deploy

      - name: Provision the least-privilege principal
        run: npm run db:provision

      # The operator principal, whose only capability is EXECUTE on the two
      # host-only procedures the authorisation migration created.
      - name: Provision the privileged-operations principal
        run: npm run db:provision:operator

      # Now meaningful: the database exists, the runtime login exists, and this
      # connects AS that login. It also asserts the server is genuinely SQL
      # Server 2022 Developer edition (major version 16), so CI cannot quietly
      # prove Phase 1 against a different engine.
      - name: Verify connectivity, version and edition
        run: npm run db:test:connection

      - name: Seed
        run: npm run db:seed

      # The guards, proven to fail closed. No database is touched.
      - name: Restore-guard proof
        run: npm run db:restore:test

      # THE recovery gate: a genuine BACKUP DATABASE, a genuine RESTORE into a
      # separate disposable database, restored-state verification, and cleanup.
      - name: Recovery proof (real backup and restore)
        run: npm run db:recovery:test

      # Phases 2, 3B and 5 add populated identity, taxonomy and People state
      # that a schema-only restore cannot prove. Keep this in the existing
      # Database foundation job: it writes representative synthetic rows,
      # performs a checksum backup/restore, verifies values, relationships,
      # invariant objects and runtime rights, and proves cleanup.
      - name: Populated recovery proof (Phases 2, 3B and 5)
        run: npm run db:recovery:populated

      # -----------------------------------------------------------------
      # Phase 7 — the storage foundation's live proofs.
      #
      # WHY HERE RATHER THAN IN `Verify`. These need a real SQL Server and a
      # real malware scanner. `Verify` has neither: it runs the suite with no
      # database, so every `*.integration.test.ts` skips there by design. This
      # job is the one that HAS a configured database, so it is where the
      # storage lifecycle, the filesystem recovery rehearsal and the real
      # scanner are genuinely exercised rather than skipped.
      #
      # It is a REQUIRED blocking job, so none of this is advisory.
      # -----------------------------------------------------------------
      - name: Start the malware scanner
        run: |
          docker run -d \
            --name minhaj-clamav-ci \
            -e CLAMAV_NO_FRESHCLAMD=true \
            -p 127.0.0.1:3310:3310 \
            clamav/clamav:1.5.2

      # clamd answers PING only once its signature database is loaded, which
      # is much later than the process starting. Waiting for the real answer
      # is what stops the suite meeting a scanner that is up but cannot scan —
      # which would make the storage tests skip and report success.
      - name: Wait for the scanner to load its signatures
        run: |
          for attempt in $(seq 1 60); do
            if docker exec minhaj-clamav-ci clamdcheck.sh >/dev/null 2>&1; then
              echo "clamd ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo 'clamd never became ready' >&2
          docker logs minhaj-clamav-ci 2>&1 | tail -40 >&2
          exit 1

      # Asserts the proofs actually RAN. A skipped storage suite would
      # otherwise look identical to a passing one, and the whole point of
      # placing these here is that they are not skipped.
      - name: Storage foundation proof (SQL, filesystem, recovery, real scanner)
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: '3310'
        run: |
          npm run test:storage -- --reporter=json --outputFile=storage-report.json
          node scripts/assert-storage-proofs.mjs storage-report.json

      - name: Stop the malware scanner
        if: always()
        run: docker rm -f minhaj-clamav-ci || true

      # -----------------------------------------------------------------
      # Phase 24 — Messaging's live proofs.
      #
      # Real SQL Server, as the least-privilege runtime principal: the current
      # relationship deciding every read and send, revocation winning on the
      # next request, support and moderation behind their live keys, ordering,
      # idempotency and read state under real concurrency, blocks racing sends,
      # and the account-closure terminal-history rule with disposition. They
      # skip without a database, so the assertion below fails the job if any of
      # them did not run.
      # -----------------------------------------------------------------
      - name: Messaging proof (real SQL Server, runtime principal)
        run: |
          npm run test:messaging -- --reporter=json --outputFile=messaging-report.json
          node scripts/assert-messaging-proofs.mjs messaging-report.json

      # -----------------------------------------------------------------
      # Phase 17 — the search foundation's live proofs.
      #
      # Real SQL Server Full-Text Search: the Arabic, Urdu, English and mixed-
      # script tokenisation assessment, query-injection safety, the stale-index
      # rule, failure, retry, crash recovery, rebuild and reconciliation. The
      # SQL Server this job started is the repository's FTS-enabled image
      # (`docker/sqlserver/Dockerfile`), so these run here and are NOT skipped
      # — the assertion below fails the job if any of them did not run.
      # -----------------------------------------------------------------
      - name: Search foundation proof (real SQL Server Full-Text Search)
        run: |
          npm run test:search -- --reporter=json --outputFile=search-report.json
          node scripts/assert-search-proofs.mjs search-report.json

      # Proves the rehearsal cleaned up after itself rather than trusting that
      # it said so. Also fails if a restore database survived a failure above.
      # Residue is verified INDEPENDENTLY of what `db:recovery:test` reported.
      # The rehearsal now fails when its own cleanup fails, but a gate that
      # trusts only the thing it is checking proves nothing about a leak that
      # the rehearsal never noticed — a crashed process, or an artifact left by
      # an earlier step. Both resource kinds are checked, and either one
      # surviving fails the job.
      # Every inspection here must produce POSITIVE evidence. The previous
      # revision ended the artifact scan with `2>/dev/null || true`, so a
      # `docker exec` that could not reach the container, or a `find` that
      # failed, produced empty output — indistinguishable from "found nothing",
      # and read as "no residue". A gate whose broken inspection is its passing
      # condition is worse than no gate.
      #
      # Each probe therefore ends by printing a marker, and the classification
      # below accepts a result ONLY when its marker is present. An inspection
      # that failed for any reason leaves no marker and fails the job. `|| true`
      # appears nowhere in an evidence-gathering command.
      - name: Verify no disposable resources survive
        if: always()
        run: |
          set -eu

          DB_SCAN=$(docker exec minhaj-sqlserver-2022 /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$(grep '^MSSQL_SA_PASSWORD=' docker/.env | cut -d= -f2-)" \
            -C -b -h-1 -W -Q "SET NOCOUNT ON; SELECT name FROM sys.databases WHERE name LIKE 'MinhajPhase1%'; SELECT 'DB_SCAN_COMPLETE';")

          # A missing backup directory means nothing was ever written, which is
          # a real answer — but only when the probe says so explicitly. It is
          # reported as its own marker rather than inferred from empty output.
          BACKUP_SCAN=$(docker exec minhaj-sqlserver-2022 sh -c '
            set -eu
            if [ ! -d /var/opt/mssql/backup ]; then
              echo BACKUP_DIRECTORY_ABSENT
              exit 0
            fi
            find /var/opt/mssql/backup -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex ".*/minhaj-phase1-[0-9a-f]{32}\.bak"
            echo BACKUP_SCAN_COMPLETE
          ')

          # >>> residue-classification
          #
          # Extracted verbatim and driven with synthetic probe results by
          # tests/config/ci-residue-evidence.test.ts, so the three outcomes —
          # clean, residue found, inspection failed — are proven rather than
          # asserted in a comment.
          #
          # The `|| true` below are on `grep` FILTERS of evidence already
          # gathered and already proven complete by the marker check, not on the
          # gathering itself: grep exits 1 when the marker line is the only
          # line, which is the clean case.
          RESIDUE=0

          DB_MARKERS=$(printf '%s\n' "$DB_SCAN" | grep -Fxc 'DB_SCAN_COMPLETE' || true)
          if [ "$DB_MARKERS" -ne 1 ]; then
            echo "The disposable-database inspection produced no conclusive result."
            exit 1
          fi

          LEFTOVER_DBS=$(printf '%s\n' "$DB_SCAN" | grep -Fvx 'DB_SCAN_COMPLETE' || true)
          if [ -n "$(printf '%s' "$LEFTOVER_DBS" | tr -d '[:space:]')" ]; then
            echo "Disposable databases survived the run:"
            printf '%s\n' "$LEFTOVER_DBS"
            RESIDUE=1
          else
            echo "No disposable test or restore databases remain."
          fi

          BACKUP_COMPLETE_MARKERS=$(printf '%s\n' "$BACKUP_SCAN" | grep -Fxc 'BACKUP_SCAN_COMPLETE' || true)
          BACKUP_ABSENT_MARKERS=$(printf '%s\n' "$BACKUP_SCAN" | grep -Fxc 'BACKUP_DIRECTORY_ABSENT' || true)
          if [ "$BACKUP_COMPLETE_MARKERS" -eq 0 ] && [ "$BACKUP_ABSENT_MARKERS" -eq 1 ]; then
            echo "No backup directory exists; no Chunk 3 artifact was ever written."
          elif [ "$BACKUP_COMPLETE_MARKERS" -eq 1 ] && [ "$BACKUP_ABSENT_MARKERS" -eq 0 ]; then
            LEFTOVER_BAKS=$(printf '%s\n' "$BACKUP_SCAN" | grep -Fvx 'BACKUP_SCAN_COMPLETE' || true)
            if [ -n "$(printf '%s' "$LEFTOVER_BAKS" | tr -d '[:space:]')" ]; then
              echo "Chunk 3 backup artifacts survived the run:"
              printf '%s\n' "$LEFTOVER_BAKS"
              RESIDUE=1
            else
              echo "No Chunk 3 backup artifacts remain in /var/opt/mssql/backup."
            fi
          else
            echo "The backup-artifact inspection produced no conclusive result."
            exit 1
          fi

          exit "$RESIDUE"
          # <<< residue-classification

      # The container and its volume are removed with the runner, but the
      # teardown is explicit so a failure leaves nothing holding the port, and
      # the ephemeral credentials do not outlive the job even in a cache.
      - name: Tear down
        if: always()
        run: |
          docker compose -f docker/compose.yaml down -v --remove-orphans || true
          rm -f docker/.env

  browser:
    name: Browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # WHY A SEPARATE JOB RATHER THAN PART OF `Verify`.
    #
    # `Verify` builds and checks the CONTAINER IMAGE, and that image is
    # deliberately browserless. Adding Chromium and its system libraries to it
    # so a test could run would change what the production image contains, for
    # the benefit of something production never does. The browser proofs
    # therefore run here, against the same production BUILD, on a runner that
    # is allowed to have a browser on it.
    #
    # It is a required job like any other. Nothing here is advisory, and a
    # failure fails the run.

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generated per run and written only to `docker/.env`, which is
      # git-ignored — the same recipe, and the same reasoning about parser-safe
      # characters, as the `Database foundation` job above.
      # `tests/config/ci-credentials.test.ts` asserts the alphabet.
      - name: Generate ephemeral database credentials
        run: |
          SA_PASSWORD="Ci$(openssl rand -hex 24)!1aZ"
          APP_PASSWORD="Ci$(openssl rand -hex 24)!2aZ"
          # Phase 2 Chunk 2: the dedicated privileged-operations principal. A
          # THIRD account, because the migration principal must not perform
          # routine bootstrap or recovery and the runtime principal must never
          # be able to (SECURITY_BASELINE.md 8.3, 18.2).
          OPERATOR_PASSWORD="Ci$(openssl rand -hex 24)!3aZ"

          echo "::add-mask::$SA_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$OPERATOR_PASSWORD"

          mkdir -p docker
          {
            echo "MSSQL_SA_PASSWORD=${SA_PASSWORD}"
            echo "MINHAJ_SQLSERVER_PORT=14330"
            echo "DATABASE_URL=sqlserver://localhost:14330;database=MinhajPlatform;user=minhaj_app;password=${APP_PASSWORD};encrypt=true;trustServerCertificate=true"
            echo "DATABASE_MIGRATION_URL=sqlserver://localhost:14330;database=MinhajPlatform;user=sa;password=${SA_PASSWORD};encrypt=true;trustServerCertificate=true"
            echo "DATABASE_APP_LOGIN=minhaj_app"
            echo "DATABASE_APP_PASSWORD=${APP_PASSWORD}"
            echo "DATABASE_OPERATOR_LOGIN=minhaj_operator_ci"
            echo "DATABASE_OPERATOR_PASSWORD=${OPERATOR_PASSWORD}"
          } > docker/.env

          chmod 600 docker/.env

      - name: Start SQL Server 2022 Developer
        run: docker compose -f docker/compose.yaml up -d --wait sqlserver

      # The suite creates its OWN disposable database per run and drops it
      # again; this is only the server it creates it on.
      - name: Create the base database
        run: |
          docker exec minhaj-sqlserver-2022 /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$(grep '^MSSQL_SA_PASSWORD=' docker/.env | cut -d= -f2-)" \
            -C -b -Q "IF DB_ID(N'MinhajPlatform') IS NULL CREATE DATABASE [MinhajPlatform];"

      - name: Generate the Prisma client
        run: npm run db:generate

      # Chromium only, matching `playwright.config.ts`. Downloading every
      # engine would triple the job for claims this suite does not make.
      - name: Install Chromium
        run: npm run test:browser:install

      # THE PRODUCTION BUILD. `next dev` behaves differently around caching,
      # cookies and Server Actions, so a browser proof that ran against it
      # would be proving something the deployment does not do.
      #
      # Built here rather than reused from `Verify`: the jobs run in parallel
      # and passing a build between them would couple them for no gain.
      - name: Build
        run: npm run build

      # `scripts/browser-server.mjs` starts the application against a
      # disposable database and drops it on the way out; Playwright starts and
      # stops that script.
      - name: Browser flows
        run: npm run test:browser

      # Traces and screenshots for a FAILURE only. A trace of an
      # authentication flow contains session cookies, so nothing is uploaded
      # for a passing run (SECURITY_BASELINE.md §19.2), and the retention is
      # short.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker/compose.yaml down -v --remove-orphans || true
          rm -f docker/.env

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Automated vulnerability scanning in CI (SECURITY_BASELINE.md §18.3).
      - name: Audit
        run: npm audit --audit-level=high
